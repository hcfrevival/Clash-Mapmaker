name: Release

# Push a tag such as v0.1.0 to release that version:
#   - builds and tests it
#   - publishes clash-map to https://hcfrevival.github.io/Clash-Mapmaker/maven/
#     (the gh-pages branch, under maven/)
#   - creates a GitHub release with the library jars and the ClashMapmaker plugin jar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set the project version
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Check out the Maven repository (gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pages
          else
            mkdir pages
            git -C pages init -b gh-pages
            git -C pages remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          touch pages/.nojekyll
          if [ -d "pages/maven/gg/hcfrevival/clash/clash-map/${{ steps.version.outputs.version }}" ]; then
            echo "Version ${{ steps.version.outputs.version }} is already published. Use a new tag." >&2
            exit 1
          fi

      - name: Publish to the Maven repository
        run: mvn -B -ntp deploy -DskipTests -DaltDeploymentRepository="pages::file://${GITHUB_WORKSPACE}/pages/maven"

      - name: Push gh-pages
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${{ steps.version.outputs.version }}"
          git push origin gh-pages

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "clash-map/target/clash-map-${version}.jar" \
            "clash-map/target/clash-map-${version}-sources.jar" \
            "clash-mapmaker/target/clash-mapmaker-${version}.jar" \
            --title "Clash Mapmaker ${version}" \
            --generate-notes
