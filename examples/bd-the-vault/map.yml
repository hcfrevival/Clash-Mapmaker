# Example Base Defense map. Raiders try to break into the vault before time runs out.
proto: 1
name: The Vault
slug: bd-the-vault
version: 1.0.0
objective: "Raiders: break 60% of the vault walls. Defenders: hold out for 20 minutes."
authors:
  - { name: ExampleBuilder, contribution: Build }
gamemode: bd
max-players: 30

world:
  spawn: { x: 0.5, y: 100, z: 0.5 }
  bounds: map-bounds

teams:
  - { id: attackers, name: Raiders, color: red, max: 20, role: attacker }
  - { id: defenders, name: Defenders, color: blue, max: 10, role: defender }

spawns:
  - team: attackers
    points:
      - { x: 0.5, y: 64, z: -150.5 }
  - team: defenders
    points:
      - { x: 0.5, y: 64, z: 20.5, yaw: 180 }

kits:
  raider:
    armor:
      helmet: diamond_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: diamond_boots
    items:
      - { slot: 0, material: diamond_sword }
      - { slot: 1, material: diamond_pickaxe, enchantments: { efficiency: 3 } }
      - { slot: 2, material: tnt, amount: 8 }
      - { slot: 3, material: flint_and_steel }
  defender:
    armor:
      helmet: iron_helmet
      chestplate: diamond_chestplate
      leggings: diamond_leggings
      boots: iron_boots
    items:
      - { slot: 0, material: diamond_sword }
      - { slot: 1, material: bow, enchantments: { power: 1 } }
      - { slot: 2, material: cobblestone, amount: 64 }
      - { slot: 9, material: arrow, amount: 64 }

regions:
  - { id: map-bounds, cuboid: { a: { x: -120, y: 0, z: -200 }, b: { x: 120, y: 255, z: 80 } }, flags: [kill-outside] }
  - { id: vault-walls, cuboid: { a: { x: -10, y: 60, z: 30 }, b: { x: 10, y: 72, z: 50 } } }

goals:
  - type: destroyable
    id: vault
    name: Vault
    owner: defenders
    region: vault-walls
    materials: [obsidian, netherite_block]
    completion: 60%
    repairable: false
    show-progress: true

respawn:
  teams:
    attackers: { kit: raider, lives: 3 }
    defenders: { kit: defender, enabled: true, delay: 10s }

time-limit: { duration: 20m, result: defenders }
